name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stockbar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package macOS arm64
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate version and toolchain
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
              echo "Tag must match VERSION (v$version)" >&2
              exit 1
            }
          fi
          [[ "$(uname -m)" == arm64 ]]
          xcodebuild -version
          swift --version
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "STOCKBAR_BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
      - name: Run unit tests
        run: swift test
      - name: Build and verify app
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-app.sh
          plutil -lint 'dist/StockBar.app/Contents/Info.plist'
          codesign --verify --deep --strict 'dist/StockBar.app'
          test -s 'dist/StockBar.app/Contents/Resources/AppIcon.icns'
          cmp Assets/SupportQR.jpg 'dist/StockBar.app/Contents/Resources/SupportQR.jpg'
          lipo 'dist/StockBar.app/Contents/MacOS/StockBar' -verify_arch arm64
      - name: Package ZIP and checksum
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          archive="StockBar-${APP_VERSION}-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent 'dist/StockBar.app' "release/$archive"
          cd release
          shasum -a 256 "$archive" > SHA256SUMS.txt
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: StockBar-${{ steps.version.outputs.version }}-macOS-arm64
          path: release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: StockBar-${{ needs.build.outputs.version }}-macOS-arm64
          path: release
      - name: Verify checksum and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS.txt)
          cat > notes.md <<'EOF'
          原生 macOS 菜单栏行情应用，支持 A 股与场内 ETF。

          下载 `StockBar-*-macOS-arm64.zip`，解压后将「StockBar.app」移入「应用程序」。
          适用 Apple Silicon，最低 macOS 13；macOS 26 支持 Liquid Glass。

          此产物为 ad-hoc 签名，尚未经过 Apple Developer ID 签名和公证，首次运行可能被 Gatekeeper 拦截。
          `SHA256SUMS.txt` 提供下载校验值。
          EOF
          if gh release view "$RELEASE_TAG" --json isDraft > existing.json 2>/dev/null; then
            if [[ "$(jq -r .isDraft existing.json)" != true ]]; then
              echo "Release already published; keeping existing assets."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "StockBar $RELEASE_TAG" --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" release/*.zip release/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
